# File-based release hints
# Adding/updating skills or agents = new capabilities → minor
release:minor:
  - any:
      - changed-files:
          - any-glob-to-any-file: ['arsenal-*/skills/**', 'arsenal-*/agents/**', 'scripts/**']

# Docs, CI config, repo infra = patch
release:patch:
  - any:
      - changed-files:
          - any-glob-to-any-file: ['README.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'SECURITY.md', 'docs/**', 'examples/**', '.github/**']